name: Scrape NBA 2K Ratings

on:
  # 只保留手动触发（Akon 2026-11-07 定：不需要每日自动，需要时在网页点一次）。
  # 原来的 `schedule: cron '0 3 * * *'`（每天 UTC 03:00 / 北京 11:00）已去掉。
  workflow_dispatch:
    inputs:
      team_type:
        description: 'Team type to scrape'
        required: true
        default: 'curr'
        type: choice
        options:
          - curr
          - class
          - allt
          - all
      reconcile_dry_run:
        description: 'Reconcile in DRY-RUN (report departed/orphan players, delete nothing)'
        required: false
        default: false
        type: boolean

# Serialize runs: two overlapping scrapes would interleave their derived-table
# rebuilds (cohortStats/teams) into inconsistent snapshots.
concurrency:
  group: scrape-nba2k
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 2kratings.com is behind Cloudflare's JS challenge, which blocks HEADLESS
    # Chrome (HTTP 403). We run the browser HEADED under a virtual display
    # (xvfb) so the challenge is solved like a real browser. Headless runs
    # silently scraped 0 players for weeks while reporting success — the
    # scraper now also exits non-zero on a 0-player run so this can't regress
    # quietly again.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --with-deps installs the OS libraries Chromium needs; xvfb provides the
      # virtual display that lets us run headed in a headless CI environment.
      - name: Install Playwright Chromium + system deps
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      # 快速自查 secret 有没有填错（只打印长度与前缀，不泄露内容）
      - name: Check deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          echo "CONVEX_DEPLOY_KEY 长度: ${#CONVEX_DEPLOY_KEY}（正确值应为 79）"
          case "$CONVEX_DEPLOY_KEY" in
            "dev:friendly-parrot-83|"*) echo "前缀正常";;
            "") echo "::error::CONVEX_DEPLOY_KEY 为空，Secret 没配或名字写错"; exit 1;;
            *) echo "::error::前缀不对（应以 dev:friendly-parrot-83| 开头）——可能 Name/Secret 填反，或复制被截断"; exit 1;;
          esac

      - name: Generate Convex client
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen

      - name: Run scraper (current teams)
        if: github.event_name == 'schedule' || github.event.inputs.team_type == 'curr'
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Scheduled runs always reconcile for real; manual dispatch can preview.
          RECONCILE_DRY_RUN: ${{ github.event.inputs.reconcile_dry_run || 'false' }}
        run: bash scripts/scrape-retry.sh curr

      - name: Run scraper (classic teams)
        if: github.event.inputs.team_type == 'class'
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Scheduled runs always reconcile for real; manual dispatch can preview.
          RECONCILE_DRY_RUN: ${{ github.event.inputs.reconcile_dry_run || 'false' }}
        run: bash scripts/scrape-retry.sh class

      - name: Run scraper (all-time teams)
        if: github.event.inputs.team_type == 'allt'
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Scheduled runs always reconcile for real; manual dispatch can preview.
          RECONCILE_DRY_RUN: ${{ github.event.inputs.reconcile_dry_run || 'false' }}
        run: bash scripts/scrape-retry.sh allt

      - name: Run scraper (all team types)
        if: github.event.inputs.team_type == 'all'
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Scheduled runs always reconcile for real; manual dispatch can preview.
          RECONCILE_DRY_RUN: ${{ github.event.inputs.reconcile_dry_run || 'false' }}
        run: |
          bash scripts/scrape-retry.sh curr
          bash scripts/scrape-retry.sh class
          bash scripts/scrape-retry.sh allt

      # cohortStats and teams are precomputed tables read by the site's
      # dossier/team queries; rebuild them after every scrape so derived stats
      # track the fresh player data. Runs only when the scrape steps succeeded
      # (default step condition), so stats never rebuild over partial data.
      # 这步用的是 internalAction（cohorts:rebuildAll），需要 deploy key 具备
      # deployment:functions:runInternalActions 权限。当前的 key 没勾这一项，
      # 所以它必然会 403 —— 但它只影响网站看板的统计表（cohorts/teams），
      # players 数据早已写完，API 不受影响。这里设成容错，避免整条流水线标红。
      - name: Rebuild derived stats tables
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          # Scheduled runs scrape curr only; rebuild only what was scraped so
          # the weekly cron never re-reads the (larger) class/allt eras.
          SCRAPED_TYPE: ${{ github.event.inputs.team_type || 'curr' }}
        run: |
          if [ "$SCRAPED_TYPE" = "all" ]; then
            npx convex run cohorts:rebuildAll
          else
            npx convex run cohorts:rebuildAll "{\"teamType\": \"$SCRAPED_TYPE\"}"
          fi

      # POST the run's actual diff (emitted by runScraper.js into
      # scrape-diff.json) so the site re-renders only the pages that changed.
      # Best-effort by design: an unreachable endpoint must never fail the
      # scrape run; pages simply stay cached until the next successful scrape.
      - name: Revalidate changed pages
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ ! -f scrape-diff.json ]; then
            echo "No scrape diff file; skipping revalidation."
            exit 0
          fi
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_URL / REVALIDATE_SECRET not configured; skipping revalidation."
            exit 0
          fi
          jq -c --arg secret "$REVALIDATE_SECRET" \
            '{secret: $secret, players: (.players // []), teams: (.teams // []), deleted: (.deleted // [])}' \
            scrape-diff.json > revalidate-body.json
          # A diff that never posts is permanently lost (unchanged players
          # never re-enter a later diff), so retry before giving up, and on
          # total failure preserve scrape-diff.json as an artifact for a
          # manual re-post.
          ok=0
          for attempt in 1 2 3; do
            if curl -sS --fail-with-body --max-time 60 -X POST "$REVALIDATE_URL/api/revalidate" \
                -H 'Content-Type: application/json' --data @revalidate-body.json; then
              ok=1
              break
            fi
            echo "Revalidation attempt $attempt failed; retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done
          if [ "$ok" = "1" ]; then
            echo "Revalidation request accepted."
          else
            echo "::warning::Revalidation failed after 3 attempts; scrape-diff.json saved as artifact for manual re-post."
            echo "REVALIDATE_FAILED=1" >> "$GITHUB_ENV"
          fi
          rm -f revalidate-body.json

      - name: Preserve scrape diff after failed revalidation
        if: env.REVALIDATE_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-diff
          path: scrape-diff.json
          retention-days: 30
